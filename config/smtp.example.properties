# Copy to smtp.local.properties (Git ignored). Use your own authorized SMTP account.
# SMTP_USER and SMTP_FROM must be the same Gmail address. SMTP_PASSWORD is an App Password, never your main Google password.
# Leave secrets blank in this tracked template. Restart Server manually after configuring the ignored local file.
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_AUTH=true
SMTP_STARTTLS=true
SMTP_SSL=false
SMTP_USER=
SMTP_PASSWORD=
SMTP_FROM=
# Alternative for implicit TLS: port 465, SMTP_SSL=true, SMTP_STARTTLS=false.
